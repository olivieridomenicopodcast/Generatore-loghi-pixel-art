<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PixelLogo</title>
<meta name="description" content="Generatore procedurale di loghi in pixel art">
<meta name="theme-color" content="#03040a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="brand"><i></i>PixelLogo</span>
</header>
<main class="main">
  <h1>PixelLogo</h1>
  <canvas id="logo" class="logo" width="32" height="32" role="img" aria-label="Logo generato dal seme"></canvas>
  <label class="field" for="seed">Seme</label>
  <div class="row">
    <input id="seed" type="text" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gen" class="btn" type="button">Genera</button>
  </div>
  <p class="dim hint">Stesso seme, stesso logo. Scrivine uno tuo oppure lascia fare al bottone.</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
